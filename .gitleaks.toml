[extend]
useDefault = true

[[allowlists]]
description = "sha256 digests pinned for the Qwen tokenizer files, only on lines keyed by a file name"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)data/eval/tokenizer-pin\.json$''']
regexTarget = "line"
regexes = ['''^\s+"[A-Za-z0-9._-]+\.json": "[0-9a-f]{64}",?$''']
